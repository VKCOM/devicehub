name: Unit Tests (vitest)
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/unit_tests.yaml'
      - 'lib/**'
      - 'test/unit/**'
      - 'test/support/**'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Provider integration tests talk to a real ADB server; devices are faked,
      # so no emulator is needed. The runner image ships the Android SDK.
      - name: Provide adb
        run: |
          ADB="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          if [ ! -x "$ADB" ]; then
            sudo apt-get update && sudo apt-get install -y adb
            ADB="$(command -v adb)"
          fi
          "$ADB" version
          echo "ADB_PATH=$ADB" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: npm run test:unit
        env:
          ADB_INTEGRATION_TESTS: '1'
