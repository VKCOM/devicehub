name: Unit Tests (vitest)
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/unit_tests.yaml'
      - 'lib/**'
      - 'test/unit/**'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
