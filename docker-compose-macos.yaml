networks:
    devicehub:
        driver: bridge

services:
    nginx:
        image: "nginx:bookworm"
        container_name: devicehub-nginx
        volumes:
            - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
            - certs:/etc/nginx/ssl:ro
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            devicehub-app:
                condition: service_started
            devicehub-websocket:
                condition: service_started
            devicehub-storage-temp:
                condition: service_started
            devicehub-storage-plugin-apk:
                condition: service_started
            devicehub-storage-plugin-image:
                condition: service_started
            devicehub-api:
                condition: service_started
            devicehub-auth:
                condition: service_started
            devicehub-provider:
                condition: service_started
            devicehub-ssl:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-mongo:
        image: mongo:7.0
        hostname: devicehub-mongo
        container_name: devicehub-mongo
        ports:
            - 27017:27017
        entrypoint: ["mongod", "--replSet", "devicehub-rs", "--bind_ip_all"]
        healthcheck:
            test: echo "rs.status()" | mongosh --port 27017 --quiet
            interval: 5s
            timeout: 30s
            start_period: 0s
            start_interval: 1s
            retries: 30
        networks:
            devicehub:
        volumes:
            - devicehub-db-volume:/data/db
    devicehub-mongosetup:
        image: mongo:7.0
        container_name: devicehub-mongosetup
        depends_on:
            devicehub-mongo:
                condition: service_healthy
        volumes:
            - ./scripts/mongo_setup.sh:/scripts/mongo_setup.sh
        restart: "no"
        entrypoint: ["bash", "/scripts/mongo_setup.sh"]
        networks:
            devicehub:
    devicehub-migrate:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-migrate
        env_file:
            - scripts/variables.env
        command: stf migrate
        depends_on:
            devicehub-mongosetup:
                condition: service_completed_successfully
        networks:
            devicehub:
    devicehub-app:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-app
        env_file:
            - scripts/variables.env
        command: stf app --port 3000 --auth-url https://${STF_DOMAIN}:${STF_PORT}/${AUTH_URL} --websocket-url https://${STF_DOMAIN}:${STF_PORT}/ --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-auth:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-auth
        env_file:
            - scripts/variables.env
        command: stf auth-mock --port 3000 --app-url https://${STF_DOMAIN}:${STF_PORT} --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-processor:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-processor
        env_file:
            - scripts/variables.env
        command: stf processor --name processor --connect-proxy tcp://devicehub-proxy:7110 --bind-router "tcp://*:7160" --heartbeat-timeout 30000
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-storage-plugin-apk:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-storage-plugin-apk
        env_file:
            - scripts/variables.env
        command: stf storage-plugin-apk --port 3000 --storage-url http://devicehub-storage-temp:3000/ --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-storage-plugin-image:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-storage-plugin-image
        env_file:
            - scripts/variables.env
        command: stf storage-plugin-image --port 3000 --storage-url http://devicehub-storage-temp:3000/ --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-storage-temp:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-storage-temp
        env_file:
            - scripts/variables.env
        command: stf storage-temp --port 3000 --save-dir /tmp --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-proxy:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-proxy
        env_file:
            - scripts/variables.env
        command: stf proxy proxy001 --bind-router "tcp://*:7110"
        ports:
            - "7110:7110"
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-websocket:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-websocket
        env_file:
            - scripts/variables.env
        command: stf websocket --port 3000 --storage-url http://devicehub-storage-temp:3000/ --connect-proxy tcp://devicehub-proxy:7110 --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-api:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-api
        env_file:
            - scripts/variables.env
        command: stf api --port 3000 --connect-proxy tcp://devicehub-proxy:7110 --secret=${STF_SECRET}
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-api-groups-engine:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-api-groups-engine
        env_file:
            - scripts/variables.env
        command: stf groups-engine --connect-proxy tcp://devicehub-proxy:7110
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            devicehub:
    devicehub-provider:
        build: .
        image: vkcom/devicehub
        container_name: devicehub-provider
        env_file:
            - scripts/variables.env
        ports:
            - "12010-12100:12010-12100"
        depends_on:
            devicehub-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        command: stf provider --name devicehub-provider --adb-host host.docker.internal --no-cleanup --connect-processor tcp://devicehub-processor:7160 --storage-url http://devicehub-storage-plugin-apk:3000/ --public-ip ${STF_DOMAIN} --min-port=12010 --max-port=12100 --heartbeat-interval 10000 --screen-ws-url-pattern "wss://${STF_DOMAIN}:${STF_PORT}/d/devicehub-provider/<%= publicPort %>/" --secret=${STF_SECRET}
        networks:
            devicehub:
    devicehub-ssl:
        image: paulczar/omgwtfssl
        environment:
            - SSL_SUBJECT=${STF_DOMAIN}:${STF_PORT}
        volumes:
            - certs:/certs:rw
volumes:
    devicehub-db-volume:
    certs:
