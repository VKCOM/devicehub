apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose-prod.yaml convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: devicehub-websocket
  name: devicehub-websocket
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: devicehub-websocket
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f ../docker-compose-prod.yaml convert
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: devicehub-websocket
    spec:
      containers:
        - args:
            - stf
            - websocket
            - --port
            - "3000"
            - --storage-url
            - https://:/
            - --connect-proxy
            - tcp://devicehub-proxy:7110
            - --secret=
          envFrom:
            - configMapRef:
                name: scripts-variables-env
          image: vkcom/devicehub
          name: devicehub-websocket
      restartPolicy: Always
