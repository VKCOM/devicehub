apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f ../docker-compose-prod.yaml convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: devicehub-api-groups-engine
  name: devicehub-api-groups-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: devicehub-api-groups-engine
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f ../docker-compose-prod.yaml convert
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: devicehub-api-groups-engine
    spec:
      containers:
        - args:
            - stf
            - groups-engine
            - --connect-proxy
            - tcp://devicehub-proxy:7110
          envFrom:
            - configMapRef:
                name: scripts-variables-env
          image: vkcom/devicehub
          name: devicehub-api-groups-engine
      restartPolicy: Always
